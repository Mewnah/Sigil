[package]
name = "sigil"
version = "0.4.0-1"
description = "Sigil desktop application"
authors = ["Sigil contributors", "Mewnah"]
license = "AGPL-3.0-only"
repository = "https://github.com/Mewnah/Sigil"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-window-state = "2"

uwuify = "^0.2"

rosc = "0.9.1"
warp = "0.3.3"
tokio = { version = "1.23.0", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "fs"] }
tokio-stream = "0.1.11"
futures = "0.3.25"
windows = { version = "0.61", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_UI_TextServices",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Media_Speech",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_WindowsProgramming",
  # P0-S0: helper-process Job Objects (P1 process host), DXGI adapter / VRAM probe (P0-H),
  # parent-console attach for `--headless` (cli), lazy DLL loading + AddDllDirectory (P0-H, rt_thread).
  "Win32_System_JobObjects",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
] }
clap = { version = "4.4", features = ["derive"] }
local-ip-address = "0.4.9"
rodio = "^0.18"
reqwest = { version = "0.12", features = ["json", "stream", "native-tls"] }
cpal = "0.15.2"
sha2 = "0.10"
hex = "0.4"
whisper-rs = "0.16"
rubato = "0.14"
# Already in the lock as a rubato dependency; used directly for RMVPE log-mel and dio autocorrelation.
realfft = "3.5"
pitch_shift = "1.0"
tungstenite = { version = "0.24", features = ["native-tls"] }
hound = "3.5"
base64 = "0.22"
kittentts = { version = "0.3.0", features = ["espeak"] }
# Voice changer + kittentts share this ort build. CUDA/DirectML need these features; the EPs are registered per
# session in src/services/neural_audio/ort_session.rs (session_builder_for_vc). kittentts creates its own CPU session.
ort = { version = "2.0.0-rc.11", default-features = true, features = ["cuda", "directml"] }
ndarray = "0.17"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
rtrb = "0.3"
# Diagnostics file log (P0-H): `log` crate bridge; the 10 MB x 5 rotating sink is in-house
# (diagnostics/logging.rs), because tracing-appender only rotates by time. No ANSI / env-filter deps.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry", "smallvec", "tracing-log"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
default = ["custom-protocol"]
background_input = []
custom-protocol = ["tauri/custom-protocol"]
# Local speech TTS uses `kittentts` for the supported speech-package format. kittentts builds its own CPU-only ORT session; the UI's cpu/cuda/dml hint is only stored for now.

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[profile.dev.package."*"]
opt-level = 3
