[package]
name = "sigil"
version = "0.4.0-1"
description = "Sigil desktop application"
authors = ["Sigil contributors", "Mewnah"]
license = "AGPL-3.0-only"
repository = "https://github.com/Mewnah/Sigil"
edition = "2021"
rust-version = "1.89" # cosmic-text 0.19 (P6-B SteamVR overlay text) declares MSRV 1.89

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs validates model-catalog/*.json and embeds the merged catalog (P1-S0b).
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-window-state = "2"

uwuify = "^0.2"

rosc = "0.9.1"
warp = "0.3.3"
tokio = { version = "1.23.0", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "fs"] }
tokio-stream = "0.1.11"
futures = "0.3.25"
windows = { version = "0.61", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_UI_TextServices",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Media_Speech",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_WindowsProgramming",
  # P0-S0: helper-process Job Objects (P1 process host), DXGI adapter / VRAM probe (P0-H),
  # parent-console attach for `--headless` (cli), lazy DLL loading + AddDllDirectory (P0-H, rt_thread).
  "Win32_System_JobObjects",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  # COM implementations (`#[windows::core::implement(IMMNotificationClient)]` for the P1 capture
  # hub's device watcher) need no extra feature in windows 0.61: the macro is always re-exported
  # and IMMNotificationClient_Impl only needs Win32_Media_Audio + Win32_Foundation (checked by P1-S0a).
  # P6-S0: process snapshots (CreateToolhelp32Snapshot) to find VRChat.exe for per-process
  # loopback capture (P6-A, audio/loopback_process.rs).
  "Win32_System_Diagnostics_ToolHelp",
] }
clap = { version = "4.4", features = ["derive"] }
local-ip-address = "0.4.9"
rodio = "^0.18"
reqwest = { version = "0.12", features = ["json", "stream", "native-tls"] }
cpal = "0.15.2"
sha2 = "0.10"
hex = "0.4"
whisper-rs = "0.16"
rubato = "0.14"
# Already in the lock as a rubato dependency; used directly for RMVPE log-mel and dio autocorrelation.
realfft = "3.5"
pitch_shift = "1.0"
tungstenite = { version = "0.24", features = ["native-tls"] }
hound = "3.5"
base64 = "0.22"
# KittenTTS is vendored in src/services/local_tts/kitten (Apache-2.0, from kittentts 0.3.0, whose
# `ort = "=2.0.0-rc.11"` pin blocked ORT upgrades). These are its dependencies; espeak-ng is the
# pure-Rust port (GPL-3.0-or-later) with its data bundled in the crates.
espeak-ng = { version = "0.1", features = ["bundled-data"] }
anyhow = "1"
fancy-regex = "0.14"
once_cell = "1"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Every Sigil ORT session (voice changer, Silero, Kitten, the EP canary) shares this build; EPs are
# registered per session in src/services/neural_audio/ort_session.rs. rc.13 = ONNX Runtime 1.28.0;
# with these features ort-sys links pyke's `cuda13,tensorrt,nvrtx,directml` Windows dist (static
# onnxruntime.lib; the CUDA EP needs CUDA 13 + cuDNN 9, i.e. driver R580+ and a Turing or newer GPU).
# Decision record: docs/adr/0001-ort-upgrade.md (fallback ladder rc.12 / CUDA 12, then rc.11).
ort = { version = "=2.0.0-rc.13", default-features = true, features = [
  "cuda",
  "directml",
  "nvrtx",
  "tensorrt",
  "half",
  "preload-dylibs",
  "copy-dylibs",
  "ndarray",
] }
# fp16 tensors (ort `half` feature) for fp16-I/O voice-changer graphs.
half = "2"
# P1 foundations (declared by the P1-S0a gate so implementers need no Cargo edits):
# lazily loaded runtime DLLs (native_runtime, sherpa-onnx, transcribe.cpp; same major as ort's),
# and model-store archive extraction (tar.gz / tar.bz2 / zip; pure-Rust backends).
libloading = "0.9"
tar = { version = "0.4", default-features = false }
bzip2 = "0.6"
flate2 = "1"
ndarray = "0.17"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
rtrb = "0.3"
# Diagnostics file log (P0-H): `log` crate bridge; the 10 MB x 5 rotating sink is in-house
# (diagnostics/logging.rs), because tracing-appender only rotates by time. No ANSI / env-filter deps.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry", "smallvec", "tracing-log"] }
# P4 translation (P4-S0): Hugging Face `tokenizer.json` for NLLB-200 on Sigil's ORT (mt_local, P4-D).
# Default features off: no progress bar, no hf-hub downloads (the model store is the only
# downloader) and no C/C++ builds (onig, esaxx `cpp`); `fancy-regex` is the pure-Rust regex backend
# (the crate needs `onig` or `fancy-regex`).
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
# P6 streamer features (P6-S0, declared so implementers need no Cargo edits):
# - wasapi: per-process loopback capture of VRChat.exe (P6-A, the Windows process-loopback API;
#   0.19 is the last release on windows 0.61, the app's version, so no second windows crate).
# - cosmic-text + tiny-skia: text shaping (CJK fallback, RTL) and rasterizing for the SteamVR
#   caption overlay (P6-B); no fontconfig (Windows fonts come from fontdb's system scan), no PNG codec.
# - mdns-sd: OSCQuery service discovery for VRChat's OSC (P6-C).
# - jpreprocess (with wana_kana): Japanese readings, hiragana and romaji (P6-L). Its dictionary
#   comes from the model store; the `naist-jdic` feature (a build-time download) stays off.
# - jieba-rs + pinyin: Chinese word segmentation and pinyin readings (P6-L).
wasapi = "0.19"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
mdns-sd = "0.21"
jpreprocess = "0.15"
wana_kana = "5"
jieba-rs = "0.11"
pinyin = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
default = ["custom-protocol"]
background_input = []
custom-protocol = ["tauri/custom-protocol"]
# Local speech TTS (neural-onnx-tts) runs the vendored KittenTTS on the CPU EP; the UI's cpu/cuda/dml hint is only stored for now.

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[profile.dev.package."*"]
opt-level = 3

# The sigil crate rebuilds on every edit: line-tables-only keeps file:line in backtraces and debuggers
# while cutting its codegen and link time. Dependencies keep their own settings and caches.
[profile.dev.package.sigil]
debug = "line-tables-only"
