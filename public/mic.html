  <style>
    * {

    :root {
      font-size: 10px;

      --radius: 0.8rem;
    }

    body {
      display: flex;

    .list {

      display: flex;

    }

<body>
  <div class="list-container">
    <div id="list"></div>
  </div>
  <div class="actionbar">
    <div class="logo">Sigil remote microphone</div>
    <div class="actions">
      <select value="English" id="select-lang" title="Language"></select>
      <select id="select-dial" title="Dialect"></select>
      <button id="button-start" @click="pog()">Start</button>
    </div>
  </div>
  <script>
    (async () => {
      const buttonStart = document.getElementById("button-start");
      const listElement = document.getElementById("list");
      const selectLang = document.getElementById("select-lang");
      const selectDial = document.getElementById("select-dial");

      // Always talk to the Sigil that served this page: its origin is what the server's Origin
      // allow-list accepts, and a `?host=` override would let a crafted link send speech elsewhere.
      const q = new URLSearchParams(window.location.search.substring(1));
      const portParam = q.get("port") || "";
      const port = /^[0-9]{1,5}$/.test(portParam) ? portParam : location.port;
      const pageHost = location.hostname || "127.0.0.1";
      const host = pageHost.includes(":") && !pageHost.startsWith("[") ? `[${pageHost}]` : pageHost;

      let recognition = null;
      let isStreaming = false;
      let connectPending = false;

      const TOPIC_STT_CMD = "stt.external.command";
      const TOPIC_STT_STATE = "stt.external.state";

      let ws = null;
      let reconnectTimer = null;
      let reconnectDelay = 1000;
      let wasConnected = false;

      function send(obj) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify(obj));
      }

      function sendExternalState(active) {
        send({
          topic: TOPIC_STT_STATE,
          data: { active }
        });
      }

      // Reconnects with backoff, so the page recovers when Sigil restarts.
      function connect() {
        const socket = new WebSocket(`ws://${host}:${port}/pubsub?id=mic-${Math.random().toString(36).slice(2)}-${Date.now()}`);
        ws = socket;
        socket.onopen = () => {
          reconnectDelay = 1000;
          wasConnected = true;
          addLog("Connected to Sigil");
          // After a reconnect, tell the host that recognition is still running.
          if (isStreaming) sendExternalState(true);
        };
        socket.onmessage = (msg) => {
          try {
            const raw = JSON.parse(msg.data);
            if (raw.topic !== TOPIC_STT_CMD || !raw.data) return;
            if (raw.data.cmd === "start") startStreaming();
            else if (raw.data.cmd === "stop") stopStreaming();
          } catch (_) { /* ignore */ }
        };
        socket.onclose = () => {
          if (ws !== socket) return;
          ws = null;
          if (wasConnected) {
            wasConnected = false;
            addLog("Disconnected from Sigil, reconnecting…");
          }
          clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(connect, reconnectDelay);
          reconnectDelay = Math.min(reconnectDelay * 2, 15000);
        };
      }
      connect();

      buttonStart.onclick = toggleStreaming;

      function toggleStreaming() {
        if (isStreaming) {
          stopStreaming();
        } else {
          startStreaming();
        }
      }

      function startStreaming() {
        if (isStreaming || connectPending) return;
        if (!('webkitSpeechRecognition' in window)) {
          addLog("Web Speech API not supported in this browser.");
          return;
        }

        connectPending = true;
        recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = selectDial.value || selectLang.value || 'en-US';

        recognition.onstart = () => {
          connectPending = false;
          isStreaming = true;
          buttonStart.textContent = "Stop Streaming";
          buttonStart.style.backgroundColor = "firebrick";
          addLog("Recognition started");
          sendExternalState(true);
        };

        recognition.onerror = (event) => {
          addLog(`Error: ${event.error}`);
          if (connectPending) connectPending = false;
        };

        recognition.onend = () => {
          if (isStreaming) {
            recognition.start(); // Auto-restart
          } else {
            buttonStart.textContent = "Start Streaming";
            buttonStart.style.backgroundColor = "seagreen";
            addLog("Recognition stopped");
            sendExternalState(false);
          }
        };

        recognition.onresult = (event) => {
          let interimTranscript = '';
          let finalTranscript = '';

          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              finalTranscript += event.results[i][0].transcript;
            } else {
              interimTranscript += event.results[i][0].transcript;
            }
          }

          // Sigil host expects the same shape as internal pubsub: topic + TextEvent data.
          const EVT_FINAL = 0;
          const EVT_INTERIM = 1;
          if (interimTranscript) {
            send({
              topic: "text.stt",
              data: { type: EVT_INTERIM, value: interimTranscript, emotes: {} }
            });
          }
          if (finalTranscript) {
            send({
              topic: "text.stt",
              data: { type: EVT_FINAL, value: finalTranscript, emotes: {} }
            });
          }
        };

        recognition.start();
      }

      function stopStreaming() {
        connectPending = false;
        isStreaming = false;
        if (recognition) {
          recognition.stop();
        }
      }

      function addLog(message) {
        if (listElement.childElementCount >= 20)
          listElement.firstChild.remove();
        const newDiv = document.createElement("div");
        const eventSpan = document.createElement("span");
        eventSpan.className = "event";
        eventSpan.textContent = "System";
        const valueSpan = document.createElement("span");
        valueSpan.className = "value";
        valueSpan.textContent = String(message);
        newDiv.append(eventSpan, valueSpan);
        listElement.append(newDiv);
      }

      // Populate languages
      if (typeof langs !== 'undefined') {
        for (let i = 0; i < langs.length; i++) {
          selectLang.options[i] = new Option(langs[i][0], i);
        }
        selectLang.selectedIndex = 10; // Default to English
        updateCountry();
        selectDial.selectedIndex = 0; // Default to US

        selectLang.onchange = updateCountry;
        selectDial.onchange = () => {
          if (recognition && isStreaming) {
            recognition.stop(); // Will restart with new lang
          }
        };
      }

      function updateCountry() {
        for (let i = selectDial.options.length - 1; i >= 0; i--) {
          selectDial.remove(i);
        }
        let list = langs[selectLang.selectedIndex];
        for (let i = 1; i < list.length; i++) {
          selectDial.options.add(new Option(list[i][1], list[i][0]));
        }
        selectDial.style.visibility = list[1].length == 1 ? 'hidden' : 'visible';
      }

    })();

  </script>
</body>
