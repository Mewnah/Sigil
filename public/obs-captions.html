<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sigil OBS Captions</title>
  <style>
    :root {
      --font-size: 54px;
      --line-height: 1.15;
      --max-lines: 2;
      --pad: 22px;
      --bg: rgba(0, 0, 0, 0.35);
      --fg: #ffffff;
      --stroke: rgba(0, 0, 0, 0.86);
      --radius: 14px;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--fg);
      font-family: "Segoe UI", "Inter", Arial, sans-serif;
    }

    #wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: var(--pad);
      box-sizing: border-box;
    }

    #caption {
      width: min(96vw, 1800px);
      font-size: var(--font-size);
      line-height: var(--line-height);
      text-align: center;
      background: var(--bg);
      border-radius: var(--radius);
      padding: 0.3em 0.5em;
      box-sizing: border-box;
      text-shadow:
        -1px -1px 0 var(--stroke),
        1px -1px 0 var(--stroke),
        -1px 1px 0 var(--stroke),
        1px 1px 0 var(--stroke),
        0 2px 8px rgba(0, 0, 0, 0.7);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: var(--max-lines);
      overflow: hidden;
      word-break: break-word;
      white-space: pre-wrap;
    }

    #status {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      font-size: 12px;
      padding: 6px 8px;
      text-align: center;
      color: #ffd37d;
      background: rgba(20, 20, 20, 0.8);
    }

    #status.ok {
      color: #8bffbf;
    }
  </style>
</head>
<body>
  <div id="status">connecting…</div>
  <div id="wrap"><div id="caption"></div></div>

  <script>
    (() => {
      const q = new URLSearchParams(window.location.search.substring(1));
      // Only the Sigil that served this page, or loopback (old links with ?host=localhost): a
      // foreign ?host= would receive this page's LAN token.
      const isLoopbackName = (h) => {
        let v = String(h || "").trim().toLowerCase().replace(/^\[|\]$/g, "").replace(/\.$/, "");
        return v === "localhost" || v.endsWith(".localhost") || v === "::1" || /^127\.\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(v);
      };
      const hostParam = (q.get("host") || "").trim();
      const hostAllowed = !hostParam || hostParam.toLowerCase() === location.hostname.toLowerCase() || isLoopbackName(hostParam);
      const rawHost = hostAllowed && hostParam ? hostParam : location.hostname;
      const host = rawHost.includes(":") && !rawHost.startsWith("[") ? `[${rawHost}]` : rawHost;
      const portParam = hostAllowed ? q.get("port") || "" : "";
      const port = /^[0-9]{1,5}$/.test(portParam) ? portParam : location.port;
      // LAN token (Sigil Settings → LAN access): needed only when OBS runs on another PC.
      const token = (q.get("token") || "").trim();
      const tokenQuery = token ? `&token=${encodeURIComponent(token)}` : "";
      // Close codes Sigil uses when it refuses this page: no or an old LAN token / this PC only.
      const CLOSE_LAN_UNAUTHORIZED = 4401;
      const CLOSE_LAN_DISABLED = 4403;
      const fontSize = parseInt(q.get("size") || "", 10);
      const maxLines = parseInt(q.get("lines") || "", 10);
      const plain = q.get("mode") === "plain";
      const statusEl = document.getElementById("status");
      const captionEl = document.getElementById("caption");

      if (Number.isFinite(fontSize) && fontSize > 8 && fontSize < 200) {
        document.documentElement.style.setProperty("--font-size", `${fontSize}px`);
      }
      if (Number.isFinite(maxLines) && maxLines > 0 && maxLines < 8) {
        document.documentElement.style.setProperty("--max-lines", String(maxLines));
      }
      if (plain) {
        document.documentElement.style.setProperty("--bg", "transparent");
        document.documentElement.style.setProperty("--stroke", "transparent");
      }

      let finalText = "";
      let interimText = "";
      let reconnectTimer = null;
      let reconnectDelay = 1200;
      // Sigil refuses a page after the WebSocket upgrade (close 4401 / 4403 right away), so `onopen`
      // fires for a refused socket too: show "connected" only once the socket stayed open this long
      // or delivered a message, and keep showing the refusal while retrying.
      const CONFIRM_MS = 1500;
      let refusalStatus = "";

      // One id per connection, never shared with another page: Sigil keys /pubsub sockets by id and
      // gives an id to the newest socket only. A timestamp alone repeats when two sources start in
      // the same millisecond. crypto.randomUUID needs a secure context (undefined on a plain-http
      // LAN page), getRandomValues does not.
      const newSocketId = () => {
        try {
          if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
          if (window.crypto && typeof window.crypto.getRandomValues === "function") {
            return Array.from(window.crypto.getRandomValues(new Uint32Array(4)), (n) => n.toString(36)).join("");
          }
        } catch (_) {
          // fall through
        }
        return `${Math.random().toString(36).slice(2)}${Math.random().toString(36).slice(2)}${Date.now().toString(36)}`;
      };

      const setStatus = (text, ok) => {
        statusEl.textContent = text;
        statusEl.className = ok ? "ok" : "";
      };

      const render = () => {
        const value = interimText || finalText;
        captionEl.textContent = value || "";
      };

      const parseEnvelope = (raw) => {
        if (!raw || typeof raw !== "object") return null;
        if (raw.topic !== "obs.caption") return null;
        const d = raw.data;
        if (!d || typeof d !== "object") return null;
        if (d.v !== 1) return null;
        if (d.type !== "final" && d.type !== "interim") return null;
        if (typeof d.value !== "string") return null;
        return d;
      };

      const openSocket = () => {
        if (!host || !port) {
          setStatus("missing host/port in URL", false);
          return;
        }
        if (!refusalStatus) setStatus(`connecting to ${host}:${port}`, false);
        let ws;
        try {
          ws = new WebSocket(`ws://${host}:${port}/pubsub?id=obs-captions-${newSocketId()}${tokenQuery}`);
        } catch (_) {
          setStatus("invalid host/port in URL", false);
          return;
        }

        let confirmTimer = null;
        let confirmed = false;
        const confirmConnected = () => {
          if (confirmed) return;
          confirmed = true;
          clearTimeout(confirmTimer);
          refusalStatus = "";
          reconnectDelay = 1200;
          setStatus(`connected ${host}:${port}`, true);
        };
        ws.onopen = () => {
          confirmTimer = setTimeout(confirmConnected, CONFIRM_MS);
        };
        ws.onmessage = (event) => {
          confirmConnected();
          try {
            const payload = JSON.parse(event.data);
            const d = parseEnvelope(payload);
            if (!d) return;
            if (d.type === "final") {
              finalText = d.value;
              interimText = "";
            } else {
              interimText = d.value;
            }
            render();
          } catch (_) {
            // ignore non-JSON payloads
          }
        };
        let refused = false;
        ws.onclose = (event) => {
          clearTimeout(confirmTimer);
          confirmed = true;
          refused = !!event && (event.code === CLOSE_LAN_UNAUTHORIZED || event.code === CLOSE_LAN_DISABLED);
          if (refused) {
            refusalStatus = event.code === CLOSE_LAN_DISABLED
              ? "Sigil only accepts this PC (Settings → LAN access)"
              : "LAN token missing or out of date: copy the LAN captions link again in Sigil";
            setStatus(refusalStatus, false);
          } else {
            refusalStatus = "";
            setStatus("disconnected, retrying…", false);
          }
          if (reconnectTimer) clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(() => {
            reconnectDelay = Math.min(reconnectDelay * 1.8, 12000);
            openSocket();
          }, refused ? 30000 : reconnectDelay);
        };
        ws.onerror = () => {
          if (!refused) setStatus("connection error", false);
        };
      };

      openSocket();
    })();
  </script>
</body>
</html>
