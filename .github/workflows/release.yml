# `pnpm tauri build` embeds Vite env at compile time. Configure repo secrets (Settings → Secrets and variables → Actions):
#   SIGIL_TWITCH_CLIENT_ID (or CURSES_TWITCH_CLIENT_ID)
#   SIGIL_TWITCH_CLIENT_SECRET (or CURSES_TWITCH_CLIENT_SECRET) — only if you use a Confidential Twitch app (auth code flow)
#   SIGIL_KICK_CLIENT_ID (or CURSES_KICK_CLIENT_ID), SIGIL_KICK_CLIENT_SECRET (or CURSES_KICK_CLIENT_SECRET)
#   VITE_GOOGLE_FONTS_API_KEY (optional; Google Fonts list in app)
# Optional redirect overrides if OAuth URLs differ from defaults: SIGIL_TWITCH_CLIENT_REDIRECT_LOCAL,
#   SIGIL_TWITCH_IMPLICIT_REDIRECT_LOCAL, SIGIL_KICK_CLIENT_REDIRECT_LOCAL (see .env.example)
#
# GPU execution providers: the release build uses scripts/release/tauri.release.conf.json, which
# stages onnxruntime_providers_shared.dll, onnxruntime_providers_cuda.dll and DirectML.dll (copied by
# ort-sys next to Sigil.exe) into both installers, next to Sigil.exe. NVIDIA's CUDA 13 / cuDNN 9
# runtime is NOT bundled: it is the opt-in "runtime/nvidia-cuda13" pack (Models & Runtimes, or
# Settings → GPU & diagnostics). See docs/adr/0003-gpu-ep-delivery.md, docs/adr/0007-native-runtime-packs.md
# and scripts/release/verify-bundle.ps1.
#
# Visual C++ runtime: the same overlay stages vcruntime140.dll, vcruntime140_1.dll, msvcp140.dll and msvcp140_1.dll
# next to Sigil.exe in both installers and the portable zip. Sigil.exe imports them at load time and a clean Windows has
# none (it exited with 0xC0000135 in Windows Sandbox). They come from this runner's Visual Studio redistributable folder
# (VC\Redist\MSVC\<version>\x64\Microsoft.VC14*.CRT, found with vswhere), never from System32 and never downloaded;
# the step "Visual C++ runtime" below fails in seconds when they are not there, instead of after the compile.
#
# Release gates (scripts/release/README.md): the catalog pin check runs before the compile (every
# published model and runtime hash-pinned, the release set immutable); verify-bundle.ps1 checks both
# installers; packaged-smoke-all.ps1 then installs the NSIS setup on this clean runner (no GPU, no
# packs) and starts it. Publishing stays manual: the job only creates a DRAFT release for the user to
# review.
name: 'release'

on:
  workflow_dispatch:

env:
  # whisper-rs-sys forwards GGML_* to whisper.cpp's CMake. Never tune for the runner's CPU: an
  # AVX-512 build crashes with an illegal instruction on friends' PCs. (src-tauri/.cargo/config.toml
  # sets the same values for local builds.)
  GGML_NATIVE: "OFF"
  GGML_AVX2: "ON"
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - uses: SebRollen/toml-action@v1.0.1
        id: version
        with:
          file: 'src-tauri/Cargo.toml'
          field: 'package.version'
      - run: echo ${{steps.version.outputs.value}}
      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Release artifacts are large and LTO-linked; cache dependencies only.
          cache-targets: "true"
          shared-key: release
      # ort-sys downloads a ~500 MB ONNX Runtime build from cdn.pyke.io on a cold cache; keep it.
      - name: Cache ONNX Runtime binaries (ort.pyke.io)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ort.pyke.io
          key: ort-dist-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ort-dist-${{ runner.os }}-
      - name: setup pnpm deps
        run: pnpm install --frozen-lockfile
      # Offline and fast (Node only): fails on a published catalog file without a size and sha256 / git_oid,
      # on a mutable source URL, and on a release-set entry that is unpublished or not covered by
      # scripts/release/release-set.json. build.rs repeats the pin rule at compile time.
      - name: Catalog pins (release set)
        run: node scripts/release/check-catalog-pins.mjs
      - name: Docs (links, anchors, tables, no TODO placeholders)
        run: node docs/check-docs.mjs --no-todo
      - name: i18n key parity
        run: pnpm i18n:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (vitest)
        run: pnpm test:unit
      - name: Visual C++ runtime (redistributable files to ship next to Sigil.exe)
        run: node scripts/release/stage-native-dlls.mjs --check-vc
      - name: Frontend build (dist/ is embedded by generate_context!, also in cargo test)
        run: pnpm build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: compile
        run: pnpm tauri build --config scripts/release/tauri.release.conf.json
        env:
          SIGIL_TWITCH_CLIENT_ID: ${{ secrets.SIGIL_TWITCH_CLIENT_ID || secrets.CURSES_TWITCH_CLIENT_ID }}
          SIGIL_TWITCH_CLIENT_SECRET: ${{ secrets.SIGIL_TWITCH_CLIENT_SECRET || secrets.CURSES_TWITCH_CLIENT_SECRET }}
          SIGIL_KICK_CLIENT_ID: ${{ secrets.SIGIL_KICK_CLIENT_ID || secrets.CURSES_KICK_CLIENT_ID }}
          SIGIL_KICK_CLIENT_SECRET: ${{ secrets.SIGIL_KICK_CLIENT_SECRET || secrets.CURSES_KICK_CLIENT_SECRET }}
          VITE_GOOGLE_FONTS_API_KEY: ${{ secrets.VITE_GOOGLE_FONTS_API_KEY }}

      - name: Verify bundle (provider DLLs in both installers, no new load-time imports, EP probe)
        shell: pwsh
        run: ./scripts/release/verify-bundle.ps1

      # The hosted runner has no GPU and no Sigil data: install the NSIS setup silently, check the headless
      # entry points, start the app on a fresh profile (server, page, Models & Runtimes empty, log, clean
      # exit), install the tiny catalog entry and the sherpa-onnx pack through the model store. This gate must
      # not pass on a check it never ran: -RequireGui turns a skipped app check (no WebView2 runtime, no
      # DevTools page) into a failure and -RequireOnline does the same for the downloads, which also fail on
      # their own whenever a host answers with a hash or size that disagrees with the catalog (a stale pin).
      # Only a host that cannot be reached at all is a skip, and -RequireOnline makes that a failure too.
      - name: Packaged smoke (clean runner, no GPU, no packs)
        shell: pwsh
        run: ./scripts/release/packaged-smoke-all.ps1 -Mode Installed -ExpectNoGpu -Online -RequireOnline -RequireGui -ResultsDir "$env:RUNNER_TEMP/packaged-smoke"
      - name: Upload smoke result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: packaged-smoke
          path: ${{ runner.temp }}/packaged-smoke/smoke-result.json
          if-no-files-found: ignore

      # Portable build: Sigil.exe alone cannot load the GPU providers or the Visual C++ runtime, so ship it with them
      # (native-bundle holds the three ONNX Runtime provider DLLs and the four Visual C++ runtime DLLs).
      - name: Portable zip
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release"
          $files = @("$dir/Sigil.exe") + (Get-ChildItem "src-tauri/target/native-bundle" -File | ForEach-Object { $_.FullName })
          Compress-Archive -Path $files -DestinationPath "$dir/Sigil_${{steps.version.outputs.value}}_x64_portable.zip" -Force

      - name: create release
        uses: softprops/action-gh-release@v1
#        if: ${{startsWith(github.ref, 'refs/tags/') }}
        with:
          name: Release ${{steps.version.outputs.value}}
          tag_name: v${{steps.version.outputs.value}}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Globs: WiX rewrites pre-release versions in the MSI name (0.4.0-1 → 0.4.0), so exact
          # names from Cargo.toml do not match. NSIS per-user setup is the recommended installer.
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/Sigil_*_x64_portable.zip
